name: Deploy To EC2

on:
  push:
    branches:
      - abc5259

jobs:
  setup:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application-secret.yml 파일 만들기
        run: echo "${{ secrets.APPLICATION_SECRET }}" > ./src/main/resources/secret.yml

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: 도커 허브에 로그인
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEPLOY_TOKEN }}

      - name: API 서버 Docker 이미지 생성
        run: docker build -t monster-server-prod -f ./Dockerfile .

      - name: Docker 이미지에 Tag 붙이기
        run: |
          docker tag monster-server-prod ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}/monster-server-prod:latest

      - name: Docker Hub에 Docker 이미지 Push하기
        run: |
          docker push ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}/monster-server-prod:latest
  deploy:
    needs: setup
    runs-on:
      - monster-prod

    steps:
      - name: Log in to Docker Hub
        run: |
          sudo docker login --username ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }} --password ${{ secrets.DOCKERHUB_DEPLOY_TOKEN }}

      - name: Stop existing container and pull latest image
        run: |
          if sudo docker inspect monster-server-prod &>/dev/null; then
            sudo docker stop monster-server-prod || true
            sudo docker rm -f monster-server-prod || true
            sudo docker image prune -af || true
          fi
          sudo docker pull ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}/monster-server-prod:latest

      - name: Run container
        run: |
          sudo docker run \
            --name monster-server-prod \
            --restart unless-stopped \
            -p 8080:8080 \
            -e PROFILE=prod \
            -d ${{ secrets.DOCKERHUB_DEPLOY_USERNAME }}/monster-server-prod:latest
