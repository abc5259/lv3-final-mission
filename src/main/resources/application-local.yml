spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:database
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

security:
  jwt:
    token:
      secret-key: ${jwt.local.secret-key}
      expire-duration: ${jwt.local.expire-duration}
