server:
  port: 8080
  tomcat:
    mbean-registry:
      enabled: true

spring:
  profiles:
    default: local

  config:
    import:
      - secret.yml

randommer:
  api-key: ${randommers.apikey}
  base-url: https://randommer.io/api/Name

management:
  metrics:
    enable:
      all: false
  endpoints:
    web:
      exposure:
        include:
          - health
    jmx:
      exposure:
        exclude: '*'
  health:
    db:
      enabled: false
    mail:
      enabled: false
